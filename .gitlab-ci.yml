include:
  - component: $CI_SERVER_FQDN/fusonic/devops/components/dotnet-test/dotnet-test@2.0.0
    inputs:
      sln-path: Extensions.slnx
      image: mcr.microsoft.com/dotnet/sdk:10.0
  - component: $CI_SERVER_FQDN/fusonic/devops/components/dotnet-test/dotnet-check-warnings@2.0.0
    inputs:
      sln-path: Extensions.slnx
      image: mcr.microsoft.com/dotnet/sdk:10.0
  - project: "fusonic/devops/images/gitlab-ci-tools"
    file: "release_tool.yml"
    ref: "5.12"

stages:
  - build
  - test
  - publish

variables:
  BUILD_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
  POSTGRES_IMAGE: "postgres:17-alpine"
  SQLSERVER_IMAGE: "mcr.microsoft.com/mssql/server:2022-latest"

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^release\// || $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

build:
  stage: build
  image: ${BUILD_IMAGE}
  before_script:
    # Workaround for SourceLink: See: https://github.com/dotnet/sourcelink/issues/689
    - git config url."https://github.com/fusonic/dotnet-extensions".insteadOf https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/fusonic/devops/dotnet/extensions
  script:
    - dotnet pack -c Release
  artifacts:
    when: on_success
    paths:
      - ./artifacts/package/release/*.nupkg
      - ./artifacts/package/release/*.snupkg
  rules:
    - when: always

# Databases run as services in CI instead of Testcontainers (see TestStartup.cs in the test projects).
dotnet:test:
  variables:
    POSTGRES_DB: "postgres"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "Developer123!"
    ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=Developer123!"
    ACCEPT_EULA: "Y"
    MSSQL_PID: "Developer"
    MSSQL_SA_PASSWORD: "Developer123!"
    ConnectionStrings__Mssql: "Server=mssql,1433;User Id=sa;Password=Developer123!;Initial Catalog=master;TrustServerCertificate=True"
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
    - name: ${SQLSERVER_IMAGE}
      alias: mssql

release:lint-merge-request:
  stage: test

release:create:
  stage: publish
  extends: .release-script
  needs: []
  dependencies: []
  before_script:
    - export RELEASE_VERSION=`sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' ./src/Directory.Build.props`
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^release\//
      when: manual

publish:
  image: ${BUILD_IMAGE}
  stage: publish
  variables:
    GIT_STRATEGY: none
    NUGET_USERNAME: droth # nuget.org user who created the trusted publishing policy (not the package-owner org, not the email)
  id_tokens:
    NUGET_ID_TOKEN:
      aud: "https://www.nuget.org"
  allow_failure: true
  script:
    - |
      if [ $CI_PIPELINE_SOURCE != "merge_request_event" ]; then
        echo "Exchanging GitLab OIDC token for a short-lived NuGet API key"
        apt-get update -qq && apt-get install -y -qq jq > /dev/null
        RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "https://www.nuget.org/api/v2/token" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $NUGET_ID_TOKEN" \
          -d "{\"username\": \"$NUGET_USERNAME\", \"tokenType\": \"ApiKey\"}")
        HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
        if [ "$HTTP_CODE" != "200" ]; then
          echo "Token exchange failed (HTTP $HTTP_CODE): $(echo "$RESPONSE" | head -n -1)"
          exit 1
        fi
        NUGET_API_KEY=$(echo "$RESPONSE" | head -n -1 | jq -r '.apiKey')

        echo "Publishing to NuGet.org"
        dotnet nuget push "artifacts/package/release/*.nupkg" -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
      fi
    
    - echo "Publishing to GitLab"
    - dotnet nuget push "artifacts/package/release/*.nupkg" --source "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --api-key $CI_JOB_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^release\// || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
